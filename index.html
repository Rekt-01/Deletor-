<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repo Mass Deleter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f6f8fa; color: #24292e; }
        .card { background: white; padding: 20px; border-radius: 6px; border: 1px solid #d1d5db; margin-bottom: 20px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 8px; margin: 8px 0 16px 0; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; }
        button { background: #238636; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.danger { background: #da3633; }
        button:hover { opacity: 0.9; }
        .repo-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
        .repo-item label { margin-left: 8px; cursor: pointer; }
        #repo-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; border: 1px solid #eee; padding: 10px; border-radius: 4px; }
        #log { font-family: monospace; background: #0b0e14; color: #57ab5a; padding: 10px; border-radius: 4px; max-height: 150px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>GitHub Repo Mass Deleter</h2>
        <p>Enter a Personal Access Token with the <strong>delete_repo</strong> scope:</p>
        <label>Personal Access Token:</label>
        <input type="password" id="token" placeholder="ghp_...">
        <button onclick="fetchRepos()">Load Repositories</button>
    </div>

    <div class="card" id="control-panel" style="display:none;">
        <h3>Select Repositories to Delete</h3>
        <div id="repo-list"></div>
        <button class="danger" onclick="deleteSelected()">Delete Selected Repositories</button>
    </div>

    <div class="card">
        <h3>Live Log</h3>
        <div id="log">Awaiting action...</div>
    </div>

<script>
async function log(message) {
    const logDiv = document.getElementById('log');
    logDiv.innerHTML += `\n${message}`;
    logDiv.scrollTop = logDiv.scrollHeight;
}

async function fetchRepos() {
    const token = document.getElementById('token').value.trim();
    if (!token) {
        alert('Please enter a token first.');
        return;
    }

    log('Fetching repositories...');
    try {
        const response = await fetch('https://api.github.com/user/repos?per_page=100', {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
        });

        if (!response.ok) throw new Error(`Failed to fetch: ${response.statusText}`);
        
        const repos = await response.json();
        const listDiv = document.getElementById('repo-list');
        listDiv.innerHTML = '';

        if (repos.length === 0) {
            listDiv.innerHTML = '<p>No repositories found.</p>';
            return;
        }

        repos.forEach(repo => {
            listDiv.innerHTML += `
                <div class="repo-item">
                    <input type="checkbox" id="repo-${repo.full_name}" value="${repo.full_name}">
                    <label for="repo-${repo.full_name}"><strong>${repo.full_name}</strong> ${repo.private ? '(Private)' : '(Public)'}</label>
                </div>
            `;
        });

        document.getElementById('control-panel').style.display = 'block';
        log(`Successfully loaded ${repos.length} repositories.`);
    } catch (err) {
        log(`Error: ${err.message}`);
    }
}

async function deleteSelected() {
    const token = document.getElementById('token').value.trim();
    const checkboxes = document.querySelectorAll('#repo-list input[type="checkbox"]:checked');

    if (checkboxes.length === 0) {
        alert('Please select at least one repository to delete.');
        return;
    }

    if (!confirm(`Are you sure you want to permanently delete ${checkboxes.length} repositories? This cannot be undone!`)) {
        return;
    }

    for (const checkbox of checkboxes) {
        const repoFullName = checkbox.value;
        log(`Deleting ${repoFullName}...`);

        try {
            const response = await fetch(`https://api.github.com/repos/${repoFullName}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
            });

            if (response.status === 204) {
                log(`Successfully deleted: ${repoFullName}`);
                checkbox.closest('.repo-item').remove();
            } else {
                const data = await response.json();
                log(`Failed to delete ${repoFullName}: ${data.message}`);
            }
        } catch (err) {
            log(`Error deleting ${repoFullName}: ${err.message}`);
        }
    }
    log('Deletion process completed.');
}
</script>

</body>
</html>
